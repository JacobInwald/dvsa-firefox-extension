name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version to release (leave empty to use the last tag on main)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  manual-release:
    name: Build & Push GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Linter
        run: npm run lint

      - name: Build WebExtension Package
        run: npm run build

      - name: Determine Release Tag
        id: determine_tag
        run: |
          git fetch --tags origin
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
            echo "Using user-provided tag: $TAG_NAME"
          else
            TAG_NAME=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || git tag --merged origin/main --sort=-version:refname 2>/dev/null | head -n 1)
            if [ -z "$TAG_NAME" ]; then
              VERSION=$(node -p "require('./manifest.json').version")
              TAG_NAME="v$VERSION"
              echo "No tag found on main, falling back to manifest version: $TAG_NAME"
            else
              echo "Found last tag on main: $TAG_NAME"
            fi
          fi
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Push to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          target_commitish: main
          draft: false
          prerelease: false
          generate_release_notes: true
          files: web-ext-artifacts/*.zip
