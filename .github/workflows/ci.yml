name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build (unsigned)
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: testbooking-unsigned
          path: web-ext-artifacts/*.zip
          retention-days: 7
